<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PULSE</title>
<link data-trunk rel="rust" data-wasm-opt="z"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#F3F3F0;--sf:#fff;--tx:#111;--mu:#595959;--ln:#E0E0DB;--rd:#E12C2C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--sf:#1C1C1C;--tx:#F3F3F0;--mu:#A9A9A9;--ln:#303030;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--sf:#1C1C1C;--tx:#F3F3F0;--mu:#A9A9A9;--ln:#303030;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.w{max-width:560px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:10px 0;display:flex;align-items:center;justify-content:space-between}
.lg{font:800 22px Manrope,Inter,sans-serif;letter-spacing:.03em}.lg i{color:var(--rd);font-style:normal}
main{padding-bottom:110px}
h2{font:800 22px Manrope,Inter,sans-serif;margin:6px 0}
small,.mu{color:var(--mu);font-size:13px}small{display:block}
.mo{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500}
.row{display:flex;align-items:center;gap:8px}.gr{flex:1;min-width:0}.sp{justify-content:space-between}
.fl{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;font:600 13px Inter,sans-serif;cursor:pointer;transition:background .2s,transform .15s}
.chip:active{transform:scale(.92)}
.chip[aria-pressed="true"],.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:12px;margin:0 0 12px}
.cd p{margin:6px 0;overflow-wrap:anywhere}
.av{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:20px;border:0;cursor:pointer}
.av.lg2{width:76px;height:76px;font-size:38px;border:4px solid var(--sf);margin-top:-38px}
.bg{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:99px;padding:2px 10px 2px 7px;font:600 11px Inter,sans-serif;letter-spacing:.05em}
.bg i{width:10px;height:10px;border-radius:50%;background:var(--k)}
.bg b{font:500 14px "IBM Plex Mono",monospace}
.ph,.cd img,.cd video{width:100%;border-radius:14px;margin:6px 0;display:block;max-height:420px;object-fit:cover}
.ph{height:200px;display:grid;place-items:center;font-size:64px}
.rx{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.rx .chip{padding:0 10px;font-size:16px}.rx .chip b{font-size:12px;margin-left:4px}
.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.5) rotate(-8deg)}}
.new{animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(-14px) scale(.97)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite}
.ln{background:none;border:0;color:var(--mu);min-height:44px;padding:0 8px;font:600 13px Inter,sans-serif;cursor:pointer}
.th{border-top:1px solid var(--ln);margin-top:6px;padding-top:6px}
input,textarea,select{width:100%;min-height:44px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:14px;padding:8px 12px;font:inherit;margin:4px 0}
textarea{min-height:70px;resize:none}
.st{display:flex;gap:12px;overflow-x:auto;padding:2px 0 10px}
.st button{flex:none;background:none;border:0;color:var(--tx);font:600 11px Inter,sans-serif;cursor:pointer;text-align:center;width:64px}
.st .rg{width:60px;height:60px;border-radius:50%;padding:3px;margin:0 auto 2px;background:conic-gradient(#40566B,#536A42,#E1B72D,#E46B24,#E12C2C,#40566B)}
.st .rg .av{width:100%;height:100%;border:3px solid var(--bg);font-size:24px}
.col{display:flex;gap:3px;align-items:flex-end;height:34px;margin-bottom:10px}.col i{flex:1;border-radius:3px;background:var(--k);transition:height .5s}
.bn{height:80px;border-radius:18px 18px 0 0}
.ms{background:var(--bg);border-radius:14px;padding:8px 12px;margin:6px 0;max-width:88%}
.ms.me{margin-left:auto;background:var(--tx);color:var(--bg)}
.ty{animation:pop 1s infinite}
.nv{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nv button{min-height:48px;min-width:56px;background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer;transition:transform .2s}
.nv [aria-current="page"]{color:var(--tx);transform:translateY(-3px);box-shadow:inset 0 -3px var(--rd)}
.nv .plus{background:conic-gradient(#40566B,#536A42,#E1B72D,#E46B24,#E12C2C,#40566B);color:#fff;border-radius:50%;width:54px;height:54px;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--sf);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto}
.sh.up{animation:up .35s}
#wh{display:block;width:230px;max-width:100%;margin:0 auto;touch-action:none;outline-offset:6px}
.sg{fill:none;stroke-width:26;transition:stroke-width .2s;cursor:pointer}.sg.on{stroke-width:42}
#wh text{fill:var(--tx);text-anchor:middle}
.sv{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;color:#fff;text-align:center;font:800 28px Manrope,Inter,sans-serif;cursor:pointer}
.sv .pb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;right:14px;height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.sv .pb i{display:block;height:100%;background:#fff;animation:pg 4s linear forwards}
@keyframes pg{from{width:0}to{width:100%}}
:focus-visible{outline:2px solid var(--rd);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style></head>
</head><body></body></html>
