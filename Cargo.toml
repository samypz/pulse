[package]
name = "pulse"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Element", "DomRect", "PointerEvent", "MouseEvent", "KeyboardEvent"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
